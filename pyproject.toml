[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crux"
version = "1.0.0"
description = "Local ZIP password recovery CLI powered by hashcat"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pyzipper>=0.3.6",
]

[project.scripts]
crux = "crux.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/crux"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/crux/**/*.py",
  "/tests/**/*.py",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
  "/uv.lock",
  "/.python-version",
  "/.gitignore",
  "/.gitattributes",
  "/codes.zip",
]
