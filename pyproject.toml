[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crux"
version = "0.2.0"
description = "Local ZIP password recovery and extraction CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyzipper>=0.3.6",
]

[project.scripts]
crux = "crux.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/crux"]
